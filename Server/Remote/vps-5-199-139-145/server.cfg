# Uses the existing local Halo 4 game assets beside this server folder.
game_directory = game
bind = 5.199.139.145:49180
name = Halo 4 - Gun Game
network = online
password =
database = data/server.sqlite3
mode = multiplayer
map = ca_blood_crash
map_pool = ca_blood_crash,ca_gore_valley,ca_spiderweb
map_variants = ca_blood_crash:gungame,ca_gore_valley:gungame,ca_spiderweb:gungame
game_variant = gungame
difficulty = 1
bots = 0
# Nativer Dedicated-Build: 1..16 Spieler plus separater Server-Peer.
# Wunsch: 125 Spieler. Dieser native Build unterstuetzt maximal 16.
# Gun Game: Exile, Longbow, Daybreak; Startkarte Exile.
max_players = 16
min_players = 1
round_seconds = 600
map_change = vote
# Nach jedem Rundenende: alle zur Lobby, 60 Sekunden Karten-/Modus-Voting.
vote_seconds = 60
workshop_download = false
headless = true
console = false
# Source RCON. To allow another LAN computer, select this server's LAN IPv4.
# The game bind must also use a reachable LAN IPv4 for remote game clients.
rcon_bind = 5.199.139.145:49182
# Generated once on first start. Edit while the server is stopped, then restart.
rcon_password_file = data/rcon-password.txt

