# Shared server policy. No gameplay or correctness tests have been run for this draft.
[administration]
# Use Create-AdminToken.ps1 for this shared credential. If missing, each server creates a credential beside its database.
# Administrative connections are accepted only from loopback.
token_file = "data/admin-token.txt"
allow_mute = true
allow_kick = true
allow_ban = true
require_identity = true # Signed persistent client key; rejects legacy JOIN/3/4/5.
admins = ["a98c9a9ed9588438717a022dfe0cff4afa8d7f0c74e86a5bb86af6fa4875c97c"] # Full 64-character IdentityFingerprint from the client INI.
moderators = [] # May kick and mute/unmute; cannot ban/unban or change maps.

[votes]
mute = true
mute_seconds = 600 # Server-wide text+voice mute after a passed vote.
kick = true
duration_seconds = 30
percent = 60
cooldown_seconds = 60
minimum_players = 3 # Two players must not be able to vote each other out.
protect_admins = true

[bots]
enabled = false # Native multiplayer bot adapter is still missing; true blocks START.
target_players = 4
difficulty = "normal"

[teams]
balance = "round" # off / round / join; native confirmation required after map load.
maximum_difference = 1
preserve_parties = true

[conduct]
# Begruessung und Regeln: kommen beim Beitritt als private Chatnachricht von "Server".
welcome = "Willkommen! Bitte fair spielen und Spass haben."
rules = ["Kein Cheaten und keine Exploits.", "Respektvoller Umgang im Chat und Voice.", "Kein Teamkill und kein Spawn-Camping."] # max. 10, je max. 140 Zeichen
# Wortfilter: Treffer werden in Chat und Spielernamen mit * ersetzt (Gross/Klein egal).
word_filter = [] # z.B. ["wort1", "wort2"]
filter_names = true
filter_warns = false # true = jeder Filter-Treffer im Chat gibt automatisch eine Verwarnung
# Verwarnungen (Admin/Moderator im Client oder RCON "warn <id> <grund>"): bei warn_limit automatischer Kick.
warn_limit = 3 # 0 = nie automatisch kicken
warn_reset_minutes = 60 # Verwarnungen verfallen nach dieser Zeit
# Ping-Limit (nur Dedicated Server, waehrend einer Partie): erst Warnung, dann Trennung.
max_ping_ms = 0 # 0 = aus, sonst 50..3000
ping_grace_seconds = 30 # so lange muss der Ping dauerhaft zu hoch sein
