# Halo 4 dedicated configuration. TOML syntax, as in the Reclaimer host flow.
# Edit this file, then run Alles-Starten.bat. Separate processes, ports and DBs.
[master]
enabled = true
bind = "127.0.0.1" # Local first. Use 0.0.0.0 on a publicly reachable host.
port = 49175
database = "data/master.sqlite3"

[defaults]
bind = "0.0.0.0"
network = "online" # Lobby accepts IPv4 clients; native gameplay supports one or two private-LAN clients.
min_players = 1
masters = ["127.0.0.1:49175"] # Your own service; not Reclaimer's Halo 3 masters.
# Optional defaults: admins = ["FULL_64_HEX_FINGERPRINT"], moderators = [].
# Each [[server]] can override admins/moderators; [] explicitly clears inherited roles.

[[server]]
name = "Halo 4 Multiplayer"
password = "" # Empty = open; otherwise the browser asks before joining.
port = 49180
mode = "multiplayer"
policy = "server-policy.cfg"
# admins = ["FULL_64_HEX_FINGERPRINT"] # Copy from Profile -> Spieler-ID kopieren.
# moderators = []
game_variant = "ctf" # slayer, ctf, koth, oddball, swat, regicide, dominion, extraction, flood/infection, ffa, escalation, grifball, ricochet (tdm = slayer)
map_change = "vote" # "vote": shared lobby; "rotation": next map directly.
# Nach jedem Rundenende: alle zur Lobby, eine Minute abstimmen.
vote_seconds = 60
round_seconds = 600 # Map cycle after 10 minutes of actual started gameplay; 0 disables the timer.
max_players = 128
map = "ca_blood_crash"
map_pool = ["ca_blood_crash", "z11_valhalla", "ca_gore_valley", "ca_canyon", "ca_basin", "ca_highrise", "dlc_dejewel", "ca_redoubt", "dlc_dejunkyard", "ca_spiderweb"]
# Fester Spielmodus pro Karte, auch im Voting sichtbar.
map_variants = "ca_blood_crash:ctf,z11_valhalla:ctf,ca_gore_valley:slayer,ca_canyon:ctf,ca_basin:slayer,ca_highrise:slayer,dlc_dejewel:slayer,ca_redoubt:ctf,dlc_dejunkyard:slayer,ca_spiderweb:ctf"
database = "data/lobby-49180.sqlite3" # Imports the previous lobby-49180.redb once.

[[server]]
name = "Halo 4 Co-op"
password = ""
port = 49182
mode = "coop"
policy = "server-policy.cfg"
map_change = "rotation"
vote_seconds = 20
round_seconds = 0 # Coop advances through the real mission-completion notification.
max_players = 16
map = "m10_crash"
map_pool = ["m10_crash", "m020", "m30_cryptum", "m40_invasion", "m60_rescue", "m70_liftoff", "m80_delta", "m90_sacrifice"]
database = "data/coop.sqlite3"

# Gun Game und B-Waffenwahl: nativen Server mit Start-Server.cmd starten.
# Waffen- und Map-Modi stehen in Server/server.cfg; siehe Waffen-Modi.txt.
