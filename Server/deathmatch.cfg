# Uses the existing local Halo 4 game assets beside this server folder.
game_directory = Packages/Halo4-Windows-Dedicated/game
bind = 127.0.0.1:49180
name = Halo 4 - Waffen-Deathmatch
network = lan
password =
database = data/server.sqlite3
mode = multiplayer
map = ca_blood_crash
map_pool = ca_blood_crash,z11_valhalla,ca_gore_valley,ca_canyon,ca_basin,ca_highrise,dlc_dejewel,ca_redoubt,dlc_dejunkyard,ca_spiderweb
# Dieses Preset verwendet seinen Modus auf allen zehn Pool-Maps.
game_variant = weapon_dm
difficulty = 1
bots = 0
# Nativer Dedicated-Build: 1..16 Spieler plus separater Server-Peer.
# 40/128 Spieler brauchen weiterhin groessere native Netzwerkstrukturen.
max_players = 16
min_players = 1
round_seconds = 600
map_change = vote
# Nach jedem Rundenende: alle zur Lobby, 60 Sekunden Karten-/Modus-Voting.
vote_seconds = 60
workshop_download = false
headless = true
console = true
# Source RCON. To allow another LAN computer, select this server's LAN IPv4.
# The game bind must also use a reachable LAN IPv4 for remote game clients.
rcon_bind = 127.0.0.1:49182
# Generated once on first start. Edit while the server is stopped, then restart.
rcon_password_file = data/rcon-password.txt

# Waffenprofile gelten auch nach einem spaeteren Moduswechsel dieser Map.
# Jede Leiter: 10 Stufen, 1 Kill pro Stufe, Sniper zuerst, Schwert zuletzt.
gungame_weapons = sniper,beam,dmr,br,carbine,assault,storm,shotgun,magnum,sword
gungame_kills_per_weapon = 1
map_gungame_weapons = ca_blood_crash:sniper,beam,dmr,br,carbine,assault,storm,shotgun,magnum,sword;z11_valhalla:sniper,beam,dmr,br,carbine,light_rifle,assault,needler,magnum,sword;ca_gore_valley:sniper,binary,beam,dmr,br,carbine,light_rifle,assault,magnum,sword;ca_canyon:sniper,beam,light_rifle,carbine,br,dmr,storm,assault,magnum,sword;ca_basin:sniper,dmr,br,carbine,assault,storm,suppressor,shotgun,magnum,sword;ca_highrise:sniper,beam,br,dmr,assault,storm,saw,shotgun,magnum,sword;dlc_dejewel:sniper,binary,light_rifle,dmr,br,carbine,assault,scattershot,magnum,sword;ca_redoubt:sniper,beam,dmr,carbine,br,light_rifle,assault,shotgun,magnum,sword;dlc_dejunkyard:sniper,br,dmr,assault,storm,suppressor,shotgun,scattershot,magnum,sword;ca_spiderweb:sniper,beam,dmr,br,carbine,assault,storm,shotgun,magnum,sword

# B und F3 benutzen dieselbe Freigabe der aktuellen Map.
# F3 braucht mindestens eine Hauptwaffe und eine Pistole; jede Map erfuellt das.
# Keine Raketenwerfer/Schwerwaffen beim zufaelligen Respawn.
deathmatch_weapons = sniper,beam,dmr,br,carbine,light_rifle,assault,storm,suppressor,shotgun,scattershot,magnum,plasma,boltshot,needler
map_deathmatch_weapons = ca_blood_crash:sniper,beam,dmr,br,carbine,assault,storm,shotgun,magnum,plasma,boltshot,needler;z11_valhalla:sniper,beam,binary,dmr,br,carbine,light_rifle,assault,shotgun,magnum,plasma,needler;ca_gore_valley:sniper,beam,binary,dmr,br,carbine,light_rifle,assault,magnum,plasma,boltshot,needler;ca_canyon:sniper,beam,dmr,br,carbine,light_rifle,assault,storm,shotgun,magnum,plasma,boltshot,needler;ca_basin:sniper,dmr,br,carbine,assault,storm,suppressor,shotgun,scattershot,magnum,plasma,boltshot,needler;ca_highrise:sniper,beam,dmr,br,assault,storm,suppressor,saw,shotgun,magnum,plasma,boltshot,needler;dlc_dejewel:sniper,binary,dmr,br,carbine,light_rifle,assault,saw,scattershot,magnum,plasma,boltshot,needler;ca_redoubt:sniper,beam,dmr,br,carbine,light_rifle,assault,storm,shotgun,magnum,plasma,boltshot,needler;dlc_dejunkyard:sniper,dmr,br,assault,storm,suppressor,shotgun,scattershot,magnum,plasma,boltshot,needler;ca_spiderweb:sniper,beam,dmr,br,carbine,assault,storm,shotgun,magnum,plasma,boltshot,needler
